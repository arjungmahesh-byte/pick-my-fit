<style>
/* Layout: one-screen phone app. Sticky top bar, scrolling view, fixed bottom tab bar. Hang-tag labels on garments. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --ink:#1b2233; --muted:#5f6778; --line:#d8dce5;
  --accent:#2747d6; --accent-ink:#ffffff; --accent-soft:#e3e8fc; --tag:#f6e7a8; --tag-ink:#3d3412;
  --good:#1f8a4c; --warn:#b26a00; --bad:#c23a3a; --shadow:0 6px 24px rgba(27,34,51,.10);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --stage:#dfe4ee;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1c2130; --ink:#eef1f7; --muted:#a2a9ba; --line:#2d3446;
  --accent:#7d95ff; --accent-ink:#0d1226; --accent-soft:#262f52; --tag:#5b5222; --tag-ink:#fbefc0;
  --good:#5fd08f; --warn:#f0b14d; --bad:#ff7d7d; --shadow:0 6px 24px rgba(0,0,0,.4); --stage:#232a3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1c2130; --ink:#eef1f7; --muted:#a2a9ba; --line:#2d3446;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}

.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

.ai ul{margin:0;padding-left:18px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
/* saved */
.olist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ocard{background:var(--panel);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;border:2px solid transparent}
.ocard.sel{border-color:var(--accent)}

.pick-badge{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .preview{width:100%;max-width:220px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;align-self:center;background:var(--panel)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);min-height:56px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:500;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
@media (max-width:380px){.builder{grid-template-columns:1fr}.stage{max-width:240px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion:no-preference){.card,.ocard,.slot{transition:transform .15s ease}.card:active,.ocard:active{transform:scale(.97)}}

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const okHex = h => /^#[0-9a-f]{6}$/i.test(String(h || "")) ? String(h).toLowerCase() : null;
const CATS = [
  {id:"top", label:"Top", plural:"Tops"},
  {id:"bottom", label:"Bottom", plural:"Bottoms"},
  {id:"dress", label:"Dress", plural:"Dresses"},
  {id:"outer", label:"Layer", plural:"Jackets & layers"},
  {id:"shoes", label:"Shoes", plural:"Shoes"},
  {id:"accessory", label:"Extra", plural:"Bags & extras"},
];
const catLabel = id => (CATS.find(c => c.id === id) || CATS[0]).label;
let toastT;
function toast(msg){ let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.append(t);} t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- color science (works offline, no AI needed) ---------- */
function hexToRgb(h){ h = okHex(h) || "#888888"; return [1,3,5].map(i => parseInt(h.slice(i,i+2),16)); }
function rgbToHex(r,g,b){ return "#" + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function hsl(h){ let [r,g,b] = hexToRgb(h).map(v => v/255); const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let H=0,S=0; const L=(mx+mn)/2; if(mx!==mn){ const d=mx-mn; S=L>.5?d/(2-mx-mn):d/(mx+mn); H = mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; H*=60;} return {h:H,s:S,l:L}; }
function isNeutral(h){ const c = hsl(h); return c.s < .16 || c.l < .14 || c.l > .92 || (c.h > 200 && c.h < 240 && c.l < .3); }
function colorName(h){ const {h:H,s,l} = hsl(h); if(l<.12) return "black"; if(l>.92) return "white"; if(s<.12) return l<.4?"charcoal":l<.7?"grey":"light grey";
  if(H>20&&H<45&&l<.45&&s<.7) return "brown"; if(H>30&&H<55&&s<.45&&l>.6) return "beige"; if(H>200&&H<245&&l<.3) return "navy";
  const names=[[12,"red"],[38,"orange"],[62,"yellow"],[85,"lime"],[160,"green"],[190,"teal"],[250,"blue"],[285,"purple"],[330,"pink"],[360,"red"]];
  return (names.find(([max]) => H < max) || names[0])[1]; }
function harmony(colors){
  // colors: one main hex per item
  const cs = colors.map(okHex).filter(Boolean);
  if(cs.length < 2) return {score:null, note:"Pick at least two pieces to check the colors."};
  const bright = cs.filter(c => !isNeutral(c));
  let score = 82, notes = [];
  if(bright.length === 0){ score = 86; notes.push("All neutrals. Safe and easy to wear; add one color if you want it to pop."); }
  else if(bright.length === 1){ score = 90; notes.push(`One color (${colorName(bright[0])}) against neutrals. Classic balance.`); }
  else {
    let pairs = 0, good = 0, clash = 0;
    for(let i=0;i<bright.length;i++) for(let j=i+1;j<bright.length;j++){
      pairs++; let d = Math.abs(hsl(bright[i]).h - hsl(bright[j]).h); d = Math.min(d, 360-d);
      if(d < 35) good++; else if(d > 150) good++; else if(d > 105 && d < 135) good += .6; else clash++;
    }
    score = Math.round(60 + 35 * (good / pairs) - 12 * clash / pairs);
    if(clash) notes.push(`${bright.map(colorName).join(" and ")} may fight each other. Try swapping one for a neutral.`);
    else notes.push(`${bright.map(colorName).join(" + ")} work together on the color wheel.`);
    if(bright.length > 3){ score -= 10; notes.push("That is a lot of colors at once."); }
  }
  const ls = cs.map(c => hsl(c).l); if(Math.max(...ls) - Math.min(...ls) < .08 && cs.length > 2){ score -= 6; notes.push("Everything is the same lightness. Some contrast helps."); }
  return {score: Math.max(30, Math.min(98, score)), note: notes.join(" ")};
}
async function extractColors(img){
  const c = document.createElement("canvas"); const N = 48; c.width = N; c.height = N; const x = c.getContext("2d", {willReadFrequently:true});
  x.drawImage(img, 0, 0, N, N); const d = x.getImageData(0,0,N,N).data;
  const px = (i,j) => { const k=(j*N+i)*4; return [d[k],d[k+1],d[k+2],d[k+3]]; };
  // border average approximates the background
  let br=[0,0,0], bn=0; for(let i=0;i<N;i++) for(const j of [0,N-1]){ for(const p of [px(i,j),px(j,i)]){ br[0]+=p[0];br[1]+=p[1];br[2]+=p[2];bn++; } }
  br = br.map(v => v/bn);
  const buckets = new Map();
  for(let j=Math.floor(N*.15);j<N*.85;j++) for(let i=Math.floor(N*.2);i<N*.8;i++){
    const [r,g,b,a] = px(i,j); if(a<128) continue;
    if(Math.hypot(r-br[0],g-br[1],b-br[2]) < 28) continue;
    const key = (r>>4)<<8 | (g>>4)<<4 | (b>>4); const e = buckets.get(key) || {n:0,r:0,g:0,b:0}; e.n++; e.r+=r; e.g+=g; e.b+=b; buckets.set(key,e);
  }
  let arr = [...buckets.values()].sort((a,b) => b.n-a.n).map(e => rgbToHex(e.r/e.n,e.g/e.n,e.b/e.n));
  const out = []; for(const h of arr){ const [r,g,b] = hexToRgb(h); if(out.every(o => { const [R,G,B] = hexToRgb(o); return Math.hypot(r-R,g-G,b-B) > 60; })) out.push(h); if(out.length===3) break; }
  if(!out.length) out.push(rgbToHex(...br));
  return out;
}

/* ---------- images ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImg(url);
    let max = 520, q = .78, out;
    for(let tries=0; tries<5; tries++){
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL("image/jpeg", q);
      if(out.length < 170000) break; max -= 80; q -= .08;
    }
    return {dataUrl: out, img: await loadImg(out)};
  } finally { URL.revokeObjectURL(url); }
}
async function dataUrlToBlob(u){ return (await fetch(u)).blob(); }

/* ---------- photo cleanup: cut out the background, crop, center on a clean card ---------- */
const CARD_BG = "#f2f3f6";
function cleanPhoto(img){
  const MAX = 480; const s = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.max(8, Math.round(img.naturalWidth*s)), H = Math.max(8, Math.round(img.naturalHeight*s)), N = W*H;
  const src = document.createElement("canvas"); src.width = W; src.height = H; const sx = src.getContext("2d", {willReadFrequently:true});
  sx.drawImage(img, 0, 0, W, H); const id = sx.getImageData(0,0,W,H); const d = id.data;
  // 1. learn the background colors from a ring around the edge (k-means, k=3)
  const ring = []; const R = Math.max(2, Math.round(Math.min(W,H)*.02));
  for(let y=0;y<H;y+=2) for(let x=0;x<W;x+=2) if(x<R||y<R||x>=W-R||y>=H-R){ const k=(y*W+x)*4; ring.push([d[k],d[k+1],d[k+2]]); }
  let cs = [ring[0], ring[Math.floor(ring.length/3)], ring[Math.floor(ring.length*2/3)]].map(c => c.slice());
  let counts = [0,0,0];

const cutCache = new Map();
function cutoutFor(item){
  if(!item) return null; if(item.cutout) return item.cutout;
  const key = item.id + ":" + (item.img||"").length; const c = cutCache.get(key);
  if(c !== undefined) return c === "pending" ? null : c;
  cutCache.set(key, "pending");
  loadImg(item.img).then(img => {
    const W = img.naturalWidth, H = img.naturalHeight; const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const x = cv.getContext("2d", {willReadFrequently:true});
    x.drawImage(img,0,0); const id = x.getImageData(0,0,W,H), d = id.data; const b = [d[0],d[1],d[2]];
    let x0=W,y0=H,x1=0,y1=0;
    for(let i=0;i<W*H;i++){ const k=i*4; const dist = Math.hypot(d[k]-b[0], d[k+1]-b[1], d[k+2]-b[2]); if(dist < 26) d[k+3] = 0; else { if(dist < 40) d[k+3] = 120; const px=i%W, py=(i-px)/W; if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py; } }
    x.putImageData(id,0,0); if(x1<=x0||y1<=y0){ cutCache.set(key, item.img); return; }
    const o = document.createElement("canvas"); o.width = x1-x0+1; o.height = y1-y0+1; o.getContext("2d").drawImage(cv, x0,y0,o.width,o.height, 0,0,o.width,o.height);
    cutCache.set(key, o.toDataURL("image/png")); render(); if(sheet && sheet.type === "model") renderSheet();
  }).catch(() => cutCache.set(key, item.img));
  return null;
}

function photoModelSVG(sel, me, opts = {}){

const idb = {
  _db:null,
  open(){ if(this._db) return this._db; this._db = new Promise((res,rej) => { try{ const r = indexedDB.open("pickmyfit",1); r.onupgradeneeded = () => r.result.createObjectStore("docs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); return this._db; },
  async all(){ const d = await this.open(); return new Promise((res,rej) => { const out = {}; const t = d.transaction("docs").objectStore("docs").openCursor(); t.onsuccess = () => { const c = t.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); }; t.onerror = () => rej(t.error); }); },

  async del(k){ const d = await this.open(); return new Promise((res,rej) => { const t = d.transaction("docs","readwrite"); t.objectStore("docs").delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};
const store = {
  mode:"loading", docs:{}, col:null,
  setSync(){ const el = $("#sync"); el.textContent = this.mode === "cloud" ? "Saved to your account" : this.mode === "local" ? "Saved on this phone" : "Opening your closet…"; },
  async startLocal(){ this.mode = "local"; try{ this.docs = await idb.all(); }catch(e){ this.docs = this.docs || {}; } this.setSync(); render(); },
  async init(){
    const timer = setTimeout(() => { if(this.mode === "loading") this.startLocal(); }, 10000);
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if(!db || !id){ clearTimeout(timer); return this.startLocal(); }
      this.col = db.collection("data/users/" + id);
      this.col.onSnapshot(snap => {
        clearTimeout(timer);
        if(this.mode === "local") return;
        const next = {}; for(const d of snap.docs) next[d.id] = d.data(); this.docs = next;
        this.mode = "cloud"; this.setSync(); render();
      }, () => { clearTimeout(timer); if(this.mode !== "local") this.startLocal(); });
    }catch(e){ clearTimeout(timer); this.startLocal(); }
  },
  async put(id, data){

        if(e && e.code === "invalid_argument"){ toast("That photo is too big to save. Try a smaller one."); throw e; }
        if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try{ await this.col.doc(id).set(data); return; }catch(_){} }

        const keep = this.docs; this.mode = "local"; this.setSync();
        for(const [k,v] of Object.entries(keep)) { try{ await idb.put(k,v); }catch(_){} }
        toast("Saving on this phone instead."); return;
      }

  bun:"M56 40 Q56 16 80 16 Q104 16 104 40 Q100 28 80 28 Q62 28 56 40 Z M70 12 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0",
  curly:"M50 46 Q44 30 54 22 Q56 8 72 10 Q80 2 90 10 Q106 8 106 22 Q116 30 110 46 Q104 34 96 30 Q88 26 80 28 Q70 26 62 32 Q56 36 50 46 Z",

let modelN = 0;
function modelSVG(sel, opts = {}){
  const me = store.docs.me; if(store.profile().mode === "photo" && me && me.photo && me.pts) return photoModelSVG(sel, me, opts);
  const p = store.profile(); const n = ++modelN; const skin = okHex(p.skin) || "#c68e64"; const hair = okHex(p.hair) || "#2b1d14";
  const it = k => sel && sel[k] ? store.item(sel[k]) : null;
  const top = it("top"), bottom = it("bottom"), dress = it("dress"), outer = it("outer"), shoes = it("shoes"), acc = it("accessory");
  const defs = [], parts = [];
  const garment = (item, key, extra = "") => {
    const s = SHAPES[key]; const [x,y,w,h] = s.box; const pid = `g${n}_${key}`; const base = okHex(item.colors && item.colors[0]) || "#999999";
    defs.push(`<pattern id="${pid}" patternUnits="userSpaceOnUse" x="${x}" y="${y}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="${base}"/>${item.fabric ? `<image href="${esc(item.fabric)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice"/>` : `<image href="${esc(item.img)}" x="${-w*.25}" y="${-h*.15}" width="${w*1.5}" height="${h*1.3}" preserveAspectRatio="xMidYMid slice"/>`}</pattern>`);
    parts.push(`<path d="${s.d}" fill="url(#${pid})" stroke="rgba(0,0,0,.22)" stroke-width="1" ${extra}/>`);
    parts.push(`<path d="${s.d}" fill="url(#shade${n})" ${extra} pointer-events="none"/>`);
  };
  // body
  parts.push(`<g fill="${skin}">
    <path d="M52 82 L40 86 L28 186 L38 190 L52 112 Z"/><path d="M108 82 L120 86 L132 186 L122 190 L108 112 Z"/>
    <circle cx="33" cy="193" r="6"/><circle cx="127" cy="193" r="6"/>
    <rect x="72" y="60" width="16" height="22" rx="6"/>
    <path d="M52 80 Q80 72 108 80 L112 170 L48 170 Z"/>
    <path d="M47 168 L113 168 L114 202 L105 334 L87 334 L81 214 L79 214 L73 334 L55 334 L46 202 Z"/>
    <ellipse cx="80" cy="42" rx="22" ry="25"/></g>`);
  parts.push(`<path d="${HAIR[p.hairStyle] ?? HAIR.short}" fill="${hair}"/>`);
  parts.push(`<g fill="#1b2233" opacity=".75"><circle cx="72" cy="44" r="2"/><circle cx="88" cy="44" r="2"/></g><path d="M74 54 Q80 58 86 54" stroke="#1b2233" stroke-width="1.6" fill="none" opacity=".6" stroke-linecap="round"/>`);
  if(dress) garment(dress, "dress");
  else {
    if(bottom) garment(bottom, "bottom_" + (["shorts","skirt"].includes(bottom.shape) ? bottom.shape : "pants"));
    if(top) garment(top, "top");
  }
  if(shoes) garment(shoes, "shoes");
  else parts.push(`<path d="${SHAPES.shoes.d}" fill="#9aa1af"/>`);
  if(outer){ garment(outer, "outer_l"); const s = SHAPES.outer_l; const pid = `g${n}_outer_l`;
    parts.push(`<g transform="translate(160 0) scale(-1 1)"><path d="${s.d}" fill="url(#${pid})" stroke="rgba(0,0,0,.22)" stroke-width="1"/><path d="${s.d}" fill="url(#shade${n})"/></g>`); }
  if(acc){ const base = okHex(acc.colors && acc.colors[0]) || "#444"; parts.push(`<path d="M120 196 L142 196 L146 226 L116 226 Z" fill="${base}" stroke="rgba(0,0,0,.25)"/><path d="M124 196 Q131 180 138 196" stroke="${base}" stroke-width="3" fill="none"/>`); }
  if(!top && !bottom && !dress && opts.hint) parts.push(`<text x="80" y="250" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6" font-family="DM Sans, sans-serif">Pick clothes →</text>`);
  defs.push(`<linearGradient id="shade${n}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>`);
  return `<svg viewBox="0 0 160 360" role="img" aria-label="${esc(opts.label || "Model wearing the outfit")}"><defs>${defs.join("")}</defs><ellipse cx="80" cy="352" rx="44" ry="6" fill="#000" opacity=".1"/>${parts.join("")}</svg>`;
}

const S = { tab:"closet", filter:"all", sel:{}, open:null, ai:null, saving:false, compare:[], ask:{occasion:"", weather:"", busy:false, result:null, err:null}, cmp:null };
try{ const t = localStorage.getItem("pmf_tab"); if(t) S.tab = t; const s = JSON.parse(localStorage.getItem("pmf_sel") || "null"); if(s) S.sel = s; }catch(_){}

function outfitColors(sel){ return Object.values(sel || {}).map(id => store.item(id)).filter(Boolean).map(i => i.colors && i.colors[0]); }

/* ---------- AI (Claude) ---------- */
let samplePromise = null;
function getSample(){ return samplePromise || (samplePromise = claude.use("sample")); }
async function imgsFor(items){
  const s = await getSample(); if(!s) return [];
  const lim = await s.limits().catch(() => null); const max = lim?.images?.maxCount || 0; if(!max) return [];
  return Promise.all(items.slice(0, max).map(i => dataUrlToBlob(i.img)));
}
function wardrobeText(){ return store.items().map(i => `- id=${i.id} | ${i.category}${i.shape?"/"+i.shape:""} | ${i.name} | colors ${(i.colors||[]).join(", ")}`).join("\n"); }
function aiErr(e){ const c = e && e.code; if(c === "not_granted") return "The AI helper isn't set up in this version yet. The color meter still works."; if(c === "rate_limited") return "The AI helper is busy. Wait a minute and try again."; if(c === "invalid_json") return "The AI gave an answer I could not read. Try again."; return "The AI helper could not answer right now. Try again in a moment."; }

async function aiTag(photo){
  const s = await getSample(); if(!s) return null;
  const lim = await s.limits().catch(() => null); if(!lim?.images) return null;
  const blob = await dataUrlToBlob(photo);
  const r = await s.json(`You are tagging one photo of a clothing item for a personal wardrobe app.
Reply with only JSON like {"name":"Navy striped tee","category":"top","shape":null,"colors":["#1f2a4d","#f4f4f0"],"style":"casual"}.
- name: 2-4 words a person would use.
- category: exactly one of top, bottom, dress, outer, shoes, accessory ("outer" = jackets, coats, cardigans, hoodies worn open).
- shape: for bottoms one of pants, shorts, skirt; otherwise null.
- colors: 1-3 hex colors of the garment itself (ignore the background), most dominant first.
- style: one word.`, {images:[blob], modelTier:"quick"});
  return r && typeof r === "object" ? r : null;
}

async function aiRate(){
  const items = Object.entries(S.sel).map(([slot,id]) => ({slot, it:store.item(id)})).filter(x => x.it);
  if(items.length < 2){ toast("Pick at least two pieces first."); return; }
  S.ai = {busy:true, live:"Looking at your outfit…"}; render();
  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const images = await imgsFor(items.map(x => x.it));
    const local = harmony(items.map(x => x.it.colors && x.it.colors[0]));
    const prompt = `You are a friendly, honest stylist helping a teenager or young adult pick an outfit from their own wardrobe. Focus on color matching first, then fit of the pieces together.
Current outfit:
${items.map((x,i) => `${i+1}. ${x.slot}: ${x.it.name} (id=${x.it.id}, colors ${(x.it.colors||[]).join(", ")})`).join("\n")}
${images.length ? `Photos of the first ${images.length} items are attached in the same order.` : ""}
Their whole wardrobe (for swap ideas):
${wardrobeText()}
A simple color-wheel check scored this ${local.score}/100.
Reply with only JSON: {"score": 1-10 number, "headline": "short verdict, max 8 words", "colors": "1-2 sentences on how the colors work together, naming them", "good": ["up to 2 short points"], "tip": "one concrete improvement", "swap": {"replace": "id of an item in the outfit or null", "with": "id from the wardrobe or null", "why": "short reason"}}`;
    const r = await s.json(prompt, {images: images.length ? images : undefined, onText: ({text}) => { if(S.ai && S.ai.busy){ S.ai.live = "Thinking it over…"; } }});
    S.ai = {busy:false, result:r, for:JSON.stringify(S.sel)};
  }catch(e){ S.ai = {busy:false, err:aiErr(e)}; }
  render();
}

async function aiSuggest(){
  if(S.ask.busy) return;
  S.ask.busy = true; S.ask.err = null; S.ask.result = null; render();
  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const r = await s.json(`You are a stylist building ONE outfit only from the person's own wardrobe below. Pick items by id. Use either a dress, or a top plus a bottom. Add a layer, shoes or an extra only if they help. Prefer good color matching.
Occasion: ${S.ask.occasion || "everyday"}
Weather: ${S.ask.weather || "not given"}
Wardrobe:
${wardrobeText()}
Reply with only JSON: {"name":"short outfit name","items":{"top":"id or null","bottom":"id or null","dress":"id or null","outer":"id or null","shoes":"id or null","accessory":"id or null"},"why":"2 sentences, mention the colors"}`, {modelTier:"default"});
    const sel = {}; for(const c of CATS){ const id = r && r.items && r.items[c.id]; if(id && store.item(id) && store.item(id).category === c.id) sel[c.id] = id; }
    if(sel.dress){ delete sel.top; delete sel.bottom; }
    if(!Object.keys(sel).length) throw {code:"invalid_json"};
    S.ask.result = {name: String(r.name || "Suggested outfit"), why: String(r.why || ""), sel};
  }catch(e){ S.ask.err = aiErr(e); }
  S.ask.busy = false; render();
}

async function aiCompare(){
  const [a,b] = S.compare.map(id => store.outfits().find(o => o.id === id));
  if(!a || !b) return;
  S.cmp = {busy:true}; render();
  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const desc = o => Object.entries(o.items||{}).map(([slot,id]) => { const i = store.item(id); return i ? `${slot}: ${i.name} (${(i.colors||[]).join(", ")})` : null; }).filter(Boolean).join("; ");
    const r = await s.json(`Help someone choose between two outfits from their wardrobe. Judge mainly on color matching and how well the pieces go together${S.ask.occasion ? `, for this occasion: ${S.ask.occasion}` : ""}.
Outfit A "${a.name}": ${desc(a)}
Outfit B "${b.name}": ${desc(b)}
Reply with only JSON: {"winner":"A" or "B","why":"2 short sentences","a":"one line about A","b":"one line about B"}`, {modelTier:"default"});
    S.cmp = {busy:false, r, a:a.id, b:b.id};
  }catch(e){ S.cmp = {busy:false, err:aiErr(e)}; }
  render();
}

  } else if(sheet.type === "model"){
    const p = sheet.draft; const me = store.docs.me;
    const modeSeg = `<div class="seg"><button class="chip" data-mode="doll" aria-pressed="${p.mode!=="photo"}">Mini model</button><button class="chip" data-mode="photo" aria-pressed="${p.mode==="photo"}">A photo of me</button></div>`;
    if(p.mode === "photo"){
      html = `<div class="stack">
      <div class="row between"><h2>You as the model</h2><button class="btn sm ghost" data-sx="close">Close</button></div>
      ${modeSeg}
      ${me && me.photo ? `<div class="stage" id="adj" style="max-width:340px;width:100%;margin:0 auto">${photoModelSVG(S.sel, me, {handles:true})}</div>
        <p class="small muted" style="margin:0">${sheet.finding ? "The AI is finding your shoulders, waist and feet…" : "Drag the blue dots onto your two shoulders, your waist and between your feet. The clothes follow."}</p>
        <div class="row"><button class="btn" data-sx="savemodel">Save</button><button class="btn line" data-sx="mephoto">Change photo</button>${me.photo ? `<button class="btn ghost" data-sx="medelete">${sheet.confirmDel ? "Tap again to remove" : "Remove photo"}</button>` : ""}</div>`
      : `<div class="banner"><b>Use a full-body photo of yourself.</b> Stand straight facing the camera, arms a little away from your body, in fitted clothes, against a plain wall. Your photo stays private in your closet. When you add it, it's sent to the AI once to find where your shoulders and feet are.</div>
        <button class="btn" data-sx="mephoto">${sheet.processing ? "Loading photo…" : "Choose a photo of me"}</button>`}
      </div>`;
    } else
    html = `<div class="stack">
      <div class="row between"><h2>Your mini model</h2><button class="btn sm ghost" data-sx="close">Close</button></div>
      ${modeSeg}
      <div class="builder"><div class="stage">${modelSVG(S.sel, {})}</div>
      <div class="stack" style="gap:12px">
        <div class="field"><label>Skin tone</label><div class="seg">${["#f6d7c3","#e9b994","#c68e64","#a0663f","#7a4a2a","#4e2f1b"].map(c => `<button class="sw" data-skin="${c}" aria-label="Skin tone" aria-pressed="${p.skin===c}" style="width:34px;height:34px;background:${c};border-width:${p.skin===c?3:1.5}px;border-color:${p.skin===c?"var(--accent)":"var(--line)"}"></button>`).join("")}</div></div>
        <div class="field"><label>Hair</label><div class="seg">${["short","long","bun","curly","none"].map(h => `<button class="chip" data-hs="${h}" aria-pressed="${p.hairStyle===h}">${h[0].toUpperCase()+h.slice(1)}</button>`).join("")}</div></div>
        <div class="field"><label>Hair color</label><div class="seg">${["#16110d","#2b1d14","#6b4325","#b07a3e","#e2c27a","#9b9b9b","#c2410c","#7c3aed"].map(c => `<button class="sw" data-hc="${c}" aria-label="Hair color" style="width:30px;height:30px;background:${c};border-width:${p.hair===c?3:1.5}px;border-color:${p.hair===c?"var(--accent)":"var(--line)"}"></button>`).join("")}</div></div>
      </div></div>
      <button class="btn" data-sx="savemodel">Save my model</button></div>`;
  } else if(sheet.type === "name"){
    html = `<div class="stack"><div class="row between"><h2>Save outfit</h2><button class="btn sm ghost" data-sx="close">Close</button></div>
      <div class="field"><label for="oname">Outfit name</label><input id="oname" value="${esc(sheet.name)}" placeholder="Friday hangout"></div>
      <button class="btn" data-sx="saveoutfit">Save</button></div>`;
  }
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
}
function openModelSheet(){ const p = store.profile(); sheet = {type:"model", draft:{...p}, orig:store.docs.profile, origMe:store.docs.me}; renderSheet(); }
async function onMePhoto(file){
  if(!file || !sheet || sheet.type !== "model") return;
  sheet.processing = true; renderSheet();
  let ph; try{ ph = await fileToPhoto(file); }catch(e){ sheet.processing = false; renderSheet(); toast("That file is not a photo I can open."); return; }
  let box = null; try{ box = cleanPhoto(ph.img).box; }catch(_){}
  const me = {kind:"me", photo:ph.dataUrl, w:ph.img.naturalWidth, h:ph.img.naturalHeight, pts:defaultPts(box)};
  store.docs = {...store.docs, me}; sheet.meDirty = true; sheet.processing = false; sheet.finding = true; renderSheet();
  try{ const pts = await aiBodyPts(me.photo); if(pts && store.docs.me === me){ me.pts = pts; } }catch(_){}
  sheet && (sheet.finding = false); if(sheet && sheet.type === "model") renderSheet();
}
// dragging the body dots
let drag = null;
document.addEventListener("pointerdown", e => { const g = e.target.closest && e.target.closest("[data-h]"); if(!g || !sheet || sheet.type !== "model") return; const svg = g.ownerSVGElement; drag = {k:g.dataset.h, svg, g}; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){} });
document.addEventListener("pointermove", e => { if(!drag) return; const r = drag.svg.getBoundingClientRect(); const fx = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)), fy = Math.min(1, Math.max(0, (e.clientY - r.top)/r.height));
  const me = store.docs.me; me.pts = {...me.pts, [drag.k]:[fx, fy]}; sheet.meDirty = true; const W = me.w, H = me.h; drag.g.querySelectorAll("circle").forEach(c => { c.setAttribute("cx", fx*W); c.setAttribute("cy", fy*H); }); });
document.addEventListener("pointerup", () => { if(!drag) return; drag = null; renderSheet(); });
function openItem(id){ const it = store.item(id); if(!it) return; sheet = {type:"item", draft:{...it, colors:[...(it.colors||[])], isNew:false}}; renderSheet(); }

async function onPhoto(file){
  if(!file) return;
  let ph; try{ ph = await fileToPhoto(file); }catch(e){ toast("That file is not a photo I can open."); return; }
  let cl = null; try{ cl = cleanPhoto(ph.img); }catch(e){ cl = null; }
  const colors = cl ? cl.colors : await extractColors(ph.img).catch(() => ["#888888"]);
  const draft = {isNew:true, id:uid("item"), kind:"item", raw:ph.dataUrl, clean:cl && cl.img, useClean:!!(cl && cl.cut), cleanFailed:!(cl && cl.cut), img:cl && cl.cut ? cl.img : ph.dataUrl, fabric:cl ? cl.fabric : null, cutout:cl ? cl.cutout : null, name:"", category:S.filter !== "all" ? S.filter : "top", shape:null, colors, tagging:true};
  sheet = {type:"item", draft}; renderSheet();
  try{
    const t = await aiTag(draft.img);
    if(sheet && sheet.draft === draft){
      if(t){
        if(!draft.nameTouched && t.name) draft.name = String(t.name).slice(0,40);
        if(!draft.catTouched && CATS.some(c => c.id === t.category)) draft.category = t.category;
        if(["pants","shorts","skirt"].includes(t.shape)) draft.shape = t.shape;
        const hx = Array.isArray(t.colors) ? t.colors.map(okHex).filter(Boolean).slice(0,3) : [];
        if(hx.length && !draft.colorTouched) draft.colors = hx;
        draft.tagNote = "Filled in by the AI. Fix anything that looks wrong.";
      } else draft.tagNote = "Colors picked from the photo. Choose the type and add a name.";
    }
  }catch(e){ if(sheet && sheet.draft === draft) draft.tagNote = "Colors picked from the photo. Choose the type and add a name."; }
  draft.tagging = false; if(sheet && sheet.draft === draft){ const n = $("#iname"); if(n && draft.nameTouched) draft.name = n.value; renderSheet(); }
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => { if(b.dataset.tab === S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  // drop picks that point at items that no longer exist
  for(const [k,id] of Object.entries(S.sel)) if(!store.item(id)) delete S.sel[k];
  $("#view").innerHTML = ({closet:vCloset, outfit:vOutfit, saved:vSaved, ask:vAsk}[S.tab] || vCloset)();
  if(sheet && sheet.type !== "item") renderSheet();
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.tab) return setTab(d.tab);
  if(d.filter){ S.filter = d.filter; return render(); }
  if(d.item) return openItem(d.item);
  if(d.slot){ S.open = S.open === d.slot ? null : d.slot; return render(); }
  if("pick" in d){ const cat = S.open; if(d.pick){ S.sel[cat] = d.pick; if(cat === "dress"){ delete S.sel.top; delete S.sel.bottom; } if(cat === "top" || cat === "bottom") delete S.sel.dress; } else delete S.sel[cat]; saveSel(); return render(); }
  if(d.swap){ const it = store.item(d.swap); if(it){ S.sel[it.category] = it.id; if(it.category === "dress"){ delete S.sel.top; delete S.sel.bottom; } if(it.category==="top"||it.category==="bottom") delete S.sel.dress; saveSel(); S.ai = null; render(); } return; }
  if(d.wear){ const o = store.outfits().find(x => x.id === d.wear); if(o){ S.sel = {...o.items}; saveSel(); S.ai = null; setTab("outfit"); } return; }
  if(d.delo){ if(b.dataset.confirm){ await store.del(d.delo); S.compare = S.compare.filter(x => x !== d.delo); render(); toast("Outfit deleted."); } else { b.dataset.confirm = "1"; b.textContent = "Sure?"; } return; }
  if(d.cmp){ const i = S.compare.indexOf(d.cmp); if(i >= 0) S.compare.splice(i,1); else { S.compare.push(d.cmp); if(S.compare.length > 2) S.compare.shift(); } S.cmp = null; return render(); }
  if(d.occ){ S.ask.occasion = d.occ; return render(); }
  // sheet controls
  if(sheet && sheet.type === "item" && d.clean){ const dr = sheet.draft; dr.name = $("#iname")?.value ?? dr.name; dr.useClean = d.clean === "1"; dr.img = dr.useClean ? dr.clean : dr.raw; return renderSheet(); }
  if(sheet && sheet.type === "item" && (d.cat || d.shape)){ const dr = sheet.draft; dr.name = $("#iname")?.value ?? dr.name; dr.nameTouched = dr.nameTouched || !!dr.name; if(d.cat){ dr.category = d.cat; dr.catTouched = true; } if(d.shape) dr.shape = d.shape; return renderSheet(); }
  if(sheet && sheet.type === "model" && d.mode){ sheet.draft.mode = d.mode; store.docs = {...store.docs, profile:{...sheet.draft}}; return renderSheet(); }
  if(sheet && sheet.type === "model" && (d.skin || d.hs || d.hc)){ const p = sheet.draft; if(d.skin) p.skin = d.skin; if(d.hs) p.hairStyle = d.hs; if(d.hc) p.hair = d.hc; store.docs = {...store.docs, profile:{...p}}; return renderSheet(); }
  if(d.sx){
    if(d.sx === "close"){ closeSheet(); return; }
    if(d.sx === "mephoto"){ $("#meIn").value = ""; $("#meIn").click(); return; }
    if(d.sx === "medelete"){ if(!sheet.confirmDel){ sheet.confirmDel = true; return renderSheet(); } await store.del("me"); sheet.origMe = undefined; sheet.draft.mode = "doll"; await store.put("profile", {...sheet.draft}); sheet.orig = store.docs.profile; sheet.confirmDel = false; renderSheet(); render(); toast("Your photo is removed."); return; }
    if(d.sx === "saveitem"){
      const dr = sheet.draft; dr.name = ($("#iname")?.value || "").trim() || `${colorName(dr.colors[0] || "#888")} ${catLabel(dr.category).toLowerCase()}`;
      if(dr.sample){ toast("Samples can’t be changed. Add your own clothes instead."); return; }
      dr.saving = true; renderSheet();
      const data = {kind:"item", name:dr.name.slice(0,40), category:dr.category, shape:dr.category === "bottom" ? (dr.shape || "pants") : null, colors:(dr.colors||[]).map(okHex).filter(Boolean).slice(0,3), img:dr.img, fabric:dr.fabric || null, cutout:dr.cutout || null, created:dr.created || Date.now()};
      try{ await store.put(dr.id, data); toast(dr.isNew ? `Added ${data.name}.` : "Saved."); closeSheet(); render(); }catch(_){ dr.saving = false; renderSheet(); }
      return;
    }
    if(d.sx === "delitem"){ const dr = sheet.draft; if(!dr.confirmDel){ dr.confirmDel = true; return renderSheet(); } await store.del(dr.id); closeSheet(); render(); toast("Deleted."); return; }
    if(d.sx === "wearitem"){ const dr = sheet.draft; S.sel[dr.category] = dr.id; if(dr.category === "dress"){ delete S.sel.top; delete S.sel.bottom; } if(dr.category==="top"||dr.category==="bottom") delete S.sel.dress; saveSel(); closeSheet(); setTab("outfit"); return; }
    if(d.sx === "savemodel"){ const p = {...sheet.draft}; if(sheet.meDirty && store.docs.me) await store.put("me", {...store.docs.me}); await store.put("profile", p); sheet.saved = true; closeSheet(); render(); toast("Your model is saved."); return; }
    if(d.sx === "saveoutfit"){ const name = ($("#oname")?.value || "").trim() || "My outfit"; const id = uid("outfit"); await store.put(id, {kind:"outfit", name:name.slice(0,40), items:{...S.sel}, created:Date.now()}); closeSheet(); render(); toast(`Saved “${name}”.`); return; }
  }
  switch(d.act){
    case "add": $("#fileIn").value = ""; $("#fileIn").click(); break;
    case "close": S.open = null; render(); break;
    case "clear": S.sel = {}; S.ai = null; saveSel(); render(); break;
    case "shuffle": {
      const by = c => store.items().filter(i => i.category === c); const pick = a => a.length ? a[Math.floor(Math.random()*a.length)].id : undefined;
      const useDress = by("dress").length && Math.random() < .3; const sel = {};
      if(useDress) sel.dress = pick(by("dress")); else { sel.top = pick(by("top")); sel.bottom = pick(by("bottom")); }
      if(Math.random() < .5) sel.outer = pick(by("outer")); sel.shoes = pick(by("shoes"));
      for(const k in sel) if(!sel[k]) delete sel[k]; S.sel = sel; S.ai = null; saveSel(); render(); break; }
    case "rate": aiRate(); break;
    case "save": if(Object.keys(S.sel).length === 0){ toast("Pick some clothes first."); break; } sheet = {type:"name", name:""}; renderSheet(); setTimeout(() => $("#oname")?.focus(), 50); break;
    case "model": openModelSheet(); break;
    case "suggest": S.ask.occasion = $("#occ")?.value ?? S.ask.occasion; S.ask.weather = $("#wx")?.value ?? S.ask.weather; aiSuggest(); break;
    case "usesug": if(S.ask.result){ S.sel = {...S.ask.result.sel}; S.ai = null; saveSel(); setTab("outfit"); } break;
    case "compare": aiCompare(); break;
    case "uncompare": S.compare = []; S.cmp = null; render(); break;
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "occ") S.ask.occasion = e.target.value;
  if(e.target.id === "iname" && sheet && sheet.draft){ sheet.draft.name = e.target.value; sheet.draft.nameTouched = true; }
  if(e.target.id === "icolor" && sheet && sheet.draft){ sheet.draft.colors = [e.target.value, ...(sheet.draft.colors||[]).slice(1)]; sheet.draft.colorTouched = true; }
});
document.addEventListener("change", e => {
  if(e.target.id === "wx") S.ask.weather = e.target.value;
  if(e.target.id === "icolor" && sheet) renderSheet();
  if(e.target.id === "fileIn") onPhoto(e.target.files && e.target.files[0]);
  if(e.target.id === "meIn") onMePhoto(e.target.files && e.target.files[0]);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet) closeSheet(); });

render();
store.setSync();
if(window.claude && typeof claude.use === "function") store.init(); else store.startLocal();
})();
</script>
