<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const okHex = h => /^#[0-9a-f]{6}$/i.test(String(h || "")) ? String(h).toLowerCase() : null;
const CATS = [
  {id:"top", label:"Top", plural:"Tops"},
  {id:"bottom", label:"Bottom", plural:"Bottoms"},
  {id:"dress", label:"Dress", plural:"Dresses"},
  {id:"outer", label:"Layer", plural:"Jackets & layers"},
  {id:"shoes", label:"Shoes", plural:"Shoes"},
  {id:"accessory", label:"Extra", plural:"Bags & extras"},
];
const catLabel = id => (CATS.find(c => c.id === id) || CATS[0]).label;
let toastT;
function toast(msg){ let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.append(t);} t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- color science (works offline, no AI needed) ---------- */
function hexToRgb(h){ h = okHex(h) || "#888888"; return [1,3,5].map(i => parseInt(h.slice(i,i+2),16)); }
function rgbToHex(r,g,b){ return "#" + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function hsl(h){ let [r,g,b] = hexToRgb(h).map(v => v/255); const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let H=0,S=0; const L=(mx+mn)/2; if(mx!==mn){ const d=mx-mn; S=L>.5?d/(2-mx-mn):d/(mx+mn); H = mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; H*=60;} return {h:H,s:S,l:L}; }
function isNeutral(h){ const c = hsl(h); return c.s < .16 || c.l < .14 || c.l > .92 || (c.h > 200 && c.h < 240 && c.l < .3); }
function colorName(h){ const {h:H,s,l} = hsl(h); if(l<.12) return "black"; if(l>.92) return "white"; if(s<.12) return l<.4?"charcoal":l<.7?"grey":"light grey";
  if(H>20&&H<45&&l<.45&&s<.7) return "brown"; if(H>30&&H<55&&s<.45&&l>.6) return "beige"; if(H>200&&H<245&&l<.3) return "navy";
  const names=[[12,"red"],[38,"orange"],[62,"yellow"],[85,"lime"],[160,"green"],[190,"teal"],[250,"blue"],[285,"purple"],[330,"pink"],[360,"red"]];
  return (names.find(([max]) => H < max) || names[0])[1]; }
function harmony(colors){
  // colors: one main hex per item
  const cs = colors.map(okHex).filter(Boolean);
  if(cs.length < 2) return {score:null, note:"Pick at least two pieces to check the colors."};
  const bright = cs.filter(c => !isNeutral(c));
  let score = 82, notes = [];
  if(bright.length === 0){ score = 86; notes.push("All neutrals. Safe and easy to wear; add one color if you want it to pop."); }
  else if(bright.length === 1){ score = 90; notes.push(`One color (${colorName(bright[0])}) against neutrals. Classic balance.`); }
  else {
    let pairs = 0, good = 0, clash = 0;
    for(let i=0;i<bright.length;i++) for(let j=i+1;j<bright.length;j++){
      pairs++; let d = Math.abs(hsl(bright[i]).h - hsl(bright[j]).h); d = Math.min(d, 360-d);
      if(d < 35) good++; else if(d > 150) good++; else if(d > 105 && d < 135) good += .6; else clash++;
    }
    score = Math.round(60 + 35 * (good / pairs) - 12 * clash / pairs);
    if(clash) notes.push(`${bright.map(colorName).join(" and ")} may fight each other. Try swapping one for a neutral.`);
    else notes.push(`${bright.map(colorName).join(" + ")} work together on the color wheel.`);
    if(bright.length > 3){ score -= 10; notes.push("That is a lot of colors at once."); }
  }
  const ls = cs.map(c => hsl(c).l); if(Math.max(...ls) - Math.min(...ls) < .08 && cs.length > 2){ score -= 6; notes.push("Everything is the same lightness. Some contrast helps."); }
  return {score: Math.max(30, Math.min(98, score)), note: notes.join(" ")};
}
async function extractColors(img){
  const c = document.createElement("canvas"); const N = 48; c.width = N; c.height = N; const x = c.getContext("2d", {willReadFrequently:true});
  x.drawImage(img, 0, 0, N, N); const d = x.getImageData(0,0,N,N).data;
  const px = (i,j) => { const k=(j*N+i)*4; return [d[k],d[k+1],d[k+2],d[k+3]]; };
  // border average approximates the background
  let br=[0,0,0], bn=0; for(let i=0;i<N;i++) for(const j of [0,N-1]){ for(const p of [px(i,j),px(j,i)]){ br[0]+=p[0];br[1]+=p[1];br[2]+=p[2];bn++; } }
  br = br.map(v => v/bn);
  const buckets = new Map();
  for(let j=Math.floor(N*.15);j<N*.85;j++) for(let i=Math.floor(N*.2);i<N*.8;i++){
    const [r,g,b,a] = px(i,j); if(a<128) continue;
    if(Math.hypot(r-br[0],g-br[1],b-br[2]) < 28) continue;
    const key = (r>>4)<<8 | (g>>4)<<4 | (b>>4); const e = buckets.get(key) || {n:0,r:0,g:0,b:0}; e.n++; e.r+=r; e.g+=g; e.b+=b; buckets.set(key,e);
  }
  let arr = [...buckets.values()].sort((a,b) => b.n-a.n).map(e => rgbToHex(e.r/e.n,e.g/e.n,e.b/e.n));
  const out = []; for(const h of arr){ const [r,g,b] = hexToRgb(h); if(out.every(o => { const [R,G,B] = hexToRgb(o); return Math.hypot(r-R,g-G,b-B) > 60; })) out.push(h); if(out.length===3) break; }
  if(!out.length) out.push(rgbToHex(...br));
  return out;
}

/* ---------- images ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImg(url);
    let max = 520, q = .78, out;
    for(let tries=0; tries<5; tries++){
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL("image/jpeg", q);
      if(out.length < 170000) break; max -= 80; q -= .08;
    }
    return {dataUrl: out, img: await loadImg(out)};
  } finally { URL.revokeObjectURL(url); }
}
async function dataUrlToBlob(u){ return (await fetch(u)).blob(); }

/* ---------- photo cleanup: cut out the background, crop, center on a clean card ---------- */
const CARD_BG = "#f2f3f6";
function cleanPhoto(img){

function kmeans(pts, k){

    cs = acc.map((a,i) => a[3] ? [a[0]/a[3],a[1]/a[3],a[2]/a[3]] : cs[i]); cnt = acc.map(a => a[3]);

const EXAMPLE_SPEC = [["white_tee", "top", null, "White tee", "#f7f6f2"], ["stripe_top", "top", null, "Striped top", "#1c2847"], ["brown_knit", "top", null, "Brown knit polo", "#5b3424"], ["blue_jeans", "bottom", "pants", "Blue jeans", "#3d5a86"], ["beige_trousers", "bottom", "pants", "Beige trousers", "#d9cdb6"], ["black_skirt", "bottom", "skirt", "Black pleated skirt", "#1d1d1f"], ["sage_dress", "dress", null, "Sage midi dress", "#8f9f86"], ["camel_jacket", "outer", null, "Camel jacket", "#b8834f"], ["brown_loafers", "shoes", null, "Brown loafers", "#4a2f22"], ["tan_tote", "accessory", null, "Tan tote bag", "#a36a3d"]];
let SAMPLES = null;
function samples(){ return SAMPLES || (SAMPLES = EXAMPLE_SPEC.map(([k, category, shape, name, color]) => ({id:"sample_" + k, kind:"item", sample:true, name, category, shape, colors:[color], img:EXAMPLE_IMG[k], created:0}))); }
const EXAMPLE_OUTFIT = {top:"sample_brown_knit", bottom:"sample_beige_trousers", shoes:"sample_brown_loafers", accessory:"sample_tan_tote"};

/* ---------- storage: your account first, this phone as backup ---------- */
const idb = {
  _db:null,
  open(){ if(this._db) return this._db; this._db = new Promise((res,rej) => { try{ const r = indexedDB.open("pickmyfit",1); r.onupgradeneeded = () => r.result.createObjectStore("docs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); return this._db; },
  async all(){ const d = await this.open(); return new Promise((res,rej) => { const out = {}; const t = d.transaction("docs").objectStore("docs").openCursor(); t.onsuccess = () => { const c = t.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); }; t.onerror = () => rej(t.error); }); },
  async put(k,v){ const d = await this.open(); return new Promise((res,rej) => { const t = d.transaction("docs","readwrite"); t.objectStore("docs").put(v,k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k){ const d = await this.open(); return new Promise((res,rej) => { const t = d.transaction("docs","readwrite"); t.objectStore("docs").delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};
const store = {
  mode:"loading", docs:{}, col:null,
  setSync(){ const el = $("#sync"); el.textContent = this.mode === "cloud" ? "Saved to your account" : this.mode === "local" ? "Saved on this phone" : "Opening your closet…"; },
  async startLocal(){ this.mode = "local"; try{ this.docs = await idb.all(); }catch(e){ this.docs = this.docs || {}; } this.setSync(); render(); },
  async init(){
    const timer = setTimeout(() => { if(this.mode === "loading") this.startLocal(); }, 10000);
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if(!db || !id){ clearTimeout(timer); return this.startLocal(); }
      this.col = db.collection("data/users/" + id);
      this.col.onSnapshot(snap => {
        clearTimeout(timer);
        if(this.mode === "local") return;
        const next = {}; for(const d of snap.docs) next[d.id] = d.data(); this.docs = next;
        this.mode = "cloud"; this.setSync(); render();
      }, () => { clearTimeout(timer); if(this.mode !== "local") this.startLocal(); });
    }catch(e){ clearTimeout(timer); this.startLocal(); }
  },
  async put(id, data){
    this.docs = {...this.docs, [id]: data};
    if(this.mode === "cloud"){
      try{ await this.col.doc(id).set(data); return; }
      catch(e){
        if(e && e.code === "quota_exceeded"){ toast("Your closet is full. Delete a few things to add more."); throw e; }
        if(e && e.code === "invalid_argument"){ toast("That photo is too big to save. Try a smaller one."); throw e; }
        if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try{ await this.col.doc(id).set(data); return; }catch(_){} }
        // no permission to save in the account: keep everything on this phone instead
        const keep = this.docs; this.mode = "local"; this.setSync();
        for(const [k,v] of Object.entries(keep)) { try{ await idb.put(k,v); }catch(_){} }
        toast("Saving on this phone instead."); return;
      }
    }
    try{ await idb.put(id, data); }catch(e){ toast("Could not save on this phone."); }
  },
  async del(id){
    const n = {...this.docs}; delete n[id]; this.docs = n;
    if(this.mode === "cloud"){ try{ await this.col.doc(id).delete(); }catch(e){ toast("Could not delete. Try again."); } }
    else { try{ await idb.del(id); }catch(_){} }
  },
  realItems(){ return Object.entries(this.docs).filter(([,d]) => d && d.kind === "item").map(([id,d]) => ({...d, id})).sort((a,b) => (b.created||0)-(a.created||0)); },
  items(){ const r = this.realItems(); return r.length ? r : samples(); },
  usingSamples(){ return this.realItems().length === 0; },
  outfits(){ return Object.entries(this.docs).filter(([,d]) => d && d.kind === "outfit").map(([id,d]) => ({...d, id})).sort((a,b) => (b.created||0)-(a.created||0)); },
  item(id){ return this.items().find(i => i.id === id) || samples().find(i => i.id === id) || null; },
};

/* ---------- the outfit collage (flat lay) ---------- */
function pieceOf(item){
  if(!item) return null;
  const u = cutoutFor(item);
  if(u){ const g = garmentInfo(u); return g ? {u, ar:g.ar, at:g.at, cut:true} : null; }
  const key = item.id + ":" + (item.img||"").length;
  if(!item.cutout && cutCache.get(key) === "none") return {u:item.img, ar:.75, at:() => ({w:.8, c:.5}), cut:false};
  return null;
}
function labelOf(item){
  const l1 = item.brand || item.shop || item.name || "";
  const bits = []; if(item.toBuy) bits.push("To buy"); if(item.price) bits.push(item.price);
  return {l1: l1.slice(0,26), l2: bits.join(" · ").slice(0,28)};
}
let collN = 0;
function collageSVG(sel, opts = {}){
  const n = ++collN; const it = k => sel && sel[k] ? store.item(sel[k]) : null;
  const VW = 600, VH = 900; const parts = [], labels = [];
  let waiting = false;
  const img = (p, x, y, w, h) => p.cut
    ? `<image href="${esc(p.u)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="none" filter="url(#cs${n})"/>`
    : `<g filter="url(#cs${n})"><clipPath id="cp${n}_${parts.length}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/></clipPath><image href="${esc(p.u)}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${n}_${parts.length})"/></g>`;
  const label = (item, cx, y, anchor = "middle") => { const {l1, l2} = labelOf(item); if(!l1 && !l2) return;
    labels.push(`<text x="${cx.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" font-family="DM Sans, Helvetica, Arial, sans-serif" fill="#1d1d1f"><tspan font-weight="700" font-size="19">${esc(l1)}</tspan>${l2 ? `<tspan x="${cx.toFixed(1)}" dy="19" font-size="15" fill="${item.toBuy ? "#b4442a" : "#4a4a4f"}" font-weight="${item.toBuy ? 700 : 500}">${esc(l2)}</tspan>` : ""}</text>`); };
  const top = it("top"), bottom = it("bottom"), dress = it("dress"), outer = it("outer"), shoes = it("shoes"), acc = it("accessory");
  const side = [outer, acc, shoes].filter(Boolean);
  const MX = side.length ? 395 : 300, MAXW = side.length ? 340 : 400;
  // main column
  if(dress){ const p = pieceOf(dress); if(!p) waiting = true; else {
    let H = 760, W = H*p.ar; if(W > MAXW){ W = MAXW; H = W/p.ar; }
    const x = MX - p.at(.3).c*W, y = (VH - H)/2 - 10; parts.push(img(p, x, y, W, H)); label(dress, MX, y + H + 28); } }
  else if(top || bottom){
    const pt = top && pieceOf(top), pb = bottom && pieceOf(bottom);
    if((top && !pt) || (bottom && !pb)) waiting = true; else {
      // natural sizes relative to each other: the waistband matches the top's body width
      let Wt = pt ? 1 : 0, Ht = pt ? 1/pt.ar : 0, Wb = 0, Hb = 0;
      if(pb){ Wb = pt ? .88*pt.at(.62).w/Math.max(.2, pb.at(.04).w) : 1; Hb = Wb/pb.ar; }
      const overlap = pt && pb ? Ht*.18 : 0; let total = Ht + Hb - overlap;
      const k = Math.min(MAXW/Math.max(Wt, Wb), 750/total, pt && !pb ? 430*pt.ar/1 : 1e9);
      Wt*=k; Ht*=k; Wb*=k; Hb*=k; total*=k;
      let y = (VH - total)/2 + 8;
      if(pt){ const x = MX - pt.at(.62).c*Wt; parts.push(img(pt, x, y, Wt, Ht)); label(top, MX, Math.max(22, y - 26)); }
      if(pb){ const yb = y + Ht - overlap*k, x = MX - pb.at(.04).c*Wb; parts.push(img(pb, x, yb, Wb, Hb)); label(bottom, MX, Math.min(VH - 30, yb + Hb + 26)); }
    }
  }
  // side column: layer, extra, shoes
  if(side.length){
    const SX = 118, SW = 180; const slotH = {outer:300, accessory:170, shoes:190};
    const want = side.map(i => slotH[i.category] || 180); const gaps = 54; let total = want.reduce((a,b)=>a+b,0) + gaps*side.length;
    const k = Math.min(1, 820/total); let y = (VH - total*k)/2 + 6;
    side.forEach((item, i) => { const p = pieceOf(item); const boxH = want[i]*k;
      if(!p){ waiting = true; y += boxH + gaps*k; return; }
      let W = SW, H = W/p.ar; if(H > boxH){ H = boxH; W = H*p.ar; }
      const x = SX - W/2, yy = y + (boxH - H)/2; parts.push(img(p, x, yy, W, H)); label(item, SX, yy + H + 24); y += boxH + gaps*k; });
  }
  const empty = !top && !bottom && !dress && !side.length;
  const size = opts.export ? `xmlns="http://www.w3.org/2000/svg" width="1200" height="1800"` : "";
  return `<svg ${size} viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(opts.label || "Outfit collage")}"><defs>
    <filter id="tx${n}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="${7}" result="t"/><feColorMatrix in="t" type="matrix" values="0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .40  0 0 0 .55 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="cs${n}" x="-15%" y="-10%" width="130%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a241c" flood-opacity=".28"/></filter></defs>
    <rect width="${VW}" height="${VH}" fill="#e7e2da"/><rect width="${VW}" height="${VH}" fill="#000" filter="url(#tx${n})" opacity=".35"/>
    <rect x="18" y="18" width="${VW-36}" height="${VH-36}" rx="6" fill="none" stroke="#b9b1a5" stroke-width="2" opacity=".55"/><rect x="30" y="30" width="${VW-60}" height="${VH-60}" rx="4" fill="none" stroke="#b9b1a5" stroke-width="1" stroke-dasharray="2 6" opacity=".6"/>
    ${parts.join("")}${labels.join("")}
    ${empty && opts.hint ? `<text x="${VW/2}" y="${VH/2}" text-anchor="middle" font-size="22" fill="#6b655c" font-family="DM Sans, Helvetica, Arial, sans-serif">Pick clothes to build your outfit</text>` : ""}
    ${waiting && !opts.export ? `<text x="${VW/2}" y="${VH-44}" text-anchor="middle" font-size="16" fill="#6b655c" font-family="DM Sans, Helvetica, Arial, sans-serif">Cutting out the photos…</text>` : ""}
  </svg>`;
}
async function shareCollage(sel, name){
  try{
    const svg = collageSVG(sel, {export:true}); const url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml"}));
    const im = await loadImg(url); const c = document.createElement("canvas"); c.width = 1200; c.height = 1800; c.getContext("2d").drawImage(im, 0, 0, 1200, 1800); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9)); const file = new File([blob], (name || "outfit").replace(/[^\w-]+/g, "-") + ".jpg", {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title: name || "My outfit"}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.append(a); a.click(); a.remove(); toast("Picture saved.");
  }catch(e){ toast("Could not make the picture. Try again."); }
}

try{ const t = localStorage.getItem("pmf_tab"); if(t) S.tab = t; const s = JSON.parse(localStorage.getItem("pmf_sel") || "null"); if(s) S.sel = s; }catch(_){}

/* ---------- AI (Claude) ---------- */
let samplePromise = null;
function getSample(){ return samplePromise || (samplePromise = claude.use("sample")); }
async function imgsFor(items){
  const s = await getSample(); if(!s) return [];
  const lim = await s.limits().catch(() => null); const max = lim?.images?.maxCount || 0; if(!max) return [];
  return Promise.all(items.slice(0, max).map(i => dataUrlToBlob(i.img)));
}
function wardrobeText(){ return store.items().map(i => `- id=${i.id} | ${i.category}${i.shape?"/"+i.shape:""} | ${i.name} | colors ${(i.colors||[]).join(", ")}${i.toBuy ? " | NOT BOUGHT YET (wishlist)" : ""}`).join("\n"); }
function aiErr(e){ const c = e && e.code; if(c === "not_granted") return "The AI helper isn't set up in this version yet. The color meter still works."; if(c === "rate_limited") return "The AI helper is busy. Wait a minute and try again."; if(c === "invalid_json") return "The AI gave an answer I could not read. Try again."; return "The AI helper could not answer right now. Try again in a moment."; }

async function aiTag(photo){
  const s = await getSample(); if(!s) return null;
  const lim = await s.limits().catch(() => null); if(!lim?.images) return null;
  const blob = await dataUrlToBlob(photo);
  const r = await s.json(`You are tagging one photo of a clothing item for a personal wardrobe app.
Reply with only JSON like {"name":"Navy striped tee","category":"top","shape":null,"colors":["#1f2a4d","#f4f4f0"],"style":"casual"}.
- name: 2-4 words a person would use.
- category: exactly one of top, bottom, dress, outer, shoes, accessory ("outer" = jackets, coats, cardigans, hoodies worn open).
- shape: for bottoms one of pants, shorts, skirt; otherwise null.
- colors: 1-3 hex colors of the garment itself (ignore the background), most dominant first.
- style: one word.`, {images:[blob], modelTier:"quick"});
  return r && typeof r === "object" ? r : null;

async function aiRate(){
  const items = Object.entries(S.sel).map(([slot,id]) => ({slot, it:store.item(id)})).filter(x => x.it);
  if(items.length < 2){ toast("Pick at least two pieces first."); return; }
  S.ai = {busy:true, live:"Looking at your outfit…"}; render();
  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const images = await imgsFor(items.map(x => x.it));
    const local = harmony(items.map(x => x.it.colors && x.it.colors[0]));
    const prompt = `You are a friendly, honest stylist helping a teenager or young adult pick an outfit from their own wardrobe. Focus on color matching first, then fit of the pieces together.
Current outfit:
${items.map((x,i) => `${i+1}. ${x.slot}: ${x.it.name} (id=${x.it.id}, colors ${(x.it.colors||[]).join(", ")})`).join("\n")}
${images.length ? `Photos of the first ${images.length} items are attached in the same order.` : ""}
Their whole wardrobe (for swap ideas):
${wardrobeText()}
A simple color-wheel check scored this ${local.score}/100.
Reply with only JSON: {"score": 1-10 number, "headline": "short verdict, max 8 words", "colors": "1-2 sentences on how the colors work together, naming them", "good": ["up to 2 short points"], "tip": "one concrete improvement", "swap": {"replace": "id of an item in the outfit or null", "with": "id from the wardrobe or null", "why": "short reason"}}`;

async function aiSuggest(){

  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const r = await s.json(`You are a stylist building ONE outfit only from the person's own wardrobe below. Pick items by id. Use either a dress, or a top plus a bottom. Add a layer, shoes or an extra only if they help. Prefer good color matching.
Occasion: ${S.ask.occasion || "everyday"}
Weather: ${S.ask.weather || "not given"}
Wardrobe:
${wardrobeText()}
Reply with only JSON: {"name":"short outfit name","items":{"top":"id or null","bottom":"id or null","dress":"id or null","outer":"id or null","shoes":"id or null","accessory":"id or null"},"why":"2 sentences, mention the colors"}`, {modelTier:"default"});

async function aiCompare(){
  const [a,b] = S.compare.map(id => store.outfits().find(o => o.id === id));
  if(!a || !b) return;
  S.cmp = {busy:true}; render();
  try{
    const s = await getSample(); if(!s) throw {code:"not_granted"};
    const desc = o => Object.entries(o.items||{}).map(([slot,id]) => { const i = store.item(id); return i ? `${slot}: ${i.name} (${(i.colors||[]).join(", ")})` : null; }).filter(Boolean).join("; ");
    const r = await s.json(`Help someone choose between two outfits from their wardrobe. Judge mainly on color matching and how well the pieces go together${S.ask.occasion ? `, for this occasion: ${S.ask.occasion}` : ""}.
Outfit A "${a.name}": ${desc(a)}
Outfit B "${b.name}": ${desc(b)}
Reply with only JSON: {"winner":"A" or "B","why":"2 short sentences","a":"one line about A","b":"one line about B"}`, {modelTier:"default"});
    S.cmp = {busy:false, r, a:a.id, b:b.id};
  }catch(e){ S.cmp = {busy:false, err:aiErr(e)}; }

async function onPhoto(file, extra){

/* ---------- shop links: pull the product photo, name and price ---------- */
let pendingPhoto = null;
function safeUrl(u){ try{ const x = new URL(String(u || "").trim()); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(_){ return null; } }
function shopName(u){ try{ const h = new URL(u).hostname.replace(/^(www|m|ae|sa|qa|kw|bh|om|en|ar)\./, ""); const b = h.split(".")[0];
  return ({trendyol:"Trendyol", maxfashion:"Max", "ty":"Trendyol", namshi:"Namshi", zara:"Zara", hm:"H&M", shein:"SHEIN", noon:"noon", amazon:"Amazon"})[b] || (b[0].toUpperCase() + b.slice(1)); }catch(_){ return ""; } }
const UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36";
function nativeHttp(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.CapacitorHttp; }
function helperUrl(){ const c = window.PICKMYFIT_CONFIG; return c && c.aiUrl ? c.aiUrl.replace(/\/+$/, "") + "/fetch" : null; }
async function helperFetch(url, binary){ const c = window.PICKMYFIT_CONFIG; const r = await fetch(helperUrl(), {method:"POST", headers:{"content-type":"application/json", "x-app-key": c.appKey || ""}, body:JSON.stringify({url, binary})}); if(!r.ok) throw new Error("helper " + r.status); return r.json(); }
async function getPage(url){
  const H = nativeHttp();
  if(H){ const r = await H.get({url, headers:{"User-Agent":UA, "Accept":"text/html,application/xhtml+xml", "Accept-Language":"en-US,en;q=0.8"}, responseType:"text"}); if(r.status >= 400) throw new Error("page " + r.status); return {html:String(r.data || ""), url:r.url || url}; }
  if(helperUrl()){ const j = await helperFetch(url, false); return {html:String(j.body || ""), url:j.url || url}; }
  const r = await fetch(url, {credentials:"omit"}); if(!r.ok) throw new Error("page " + r.status); return {html:await r.text(), url:r.url || url};
}
async function getImage(url){
  const H = nativeHttp();
  if(H){ const r = await H.get({url, headers:{"User-Agent":UA, "Accept":"image/*"}, responseType:"blob"}); if(r.status >= 400) throw new Error("img " + r.status);
    const ct = (r.headers && (r.headers["Content-Type"] || r.headers["content-type"])) || "image/jpeg"; return (await fetch(`data:${ct.split(";")[0]};base64,${r.data}`)).blob(); }
  if(helperUrl()){ const j = await helperFetch(url, true); return (await fetch(`data:${j.contentType || "image/jpeg"};base64,${j.body}`)).blob(); }
  const r = await fetch(url, {credentials:"omit"}); if(!r.ok) throw new Error("img " + r.status); return r.blob();
}
function parseProduct(html, base){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const meta = k => (doc.querySelector(`meta[property="${k}"],meta[name="${k}"]`) || {}).content || "";
  let title = "", image = "", price = "", cur = "", brand = "";
  for(const sc of doc.querySelectorAll('script[type="application/ld+json"]')){
    try{ const j = JSON.parse(sc.textContent); for(const o of [].concat(j && j["@graph"] || j)){ if(!o || !/Product/i.test([].concat(o["@type"]).join(" "))) continue;
      let im = [].concat(o.image || [])[0]; if(im && typeof im === "object") im = im.url || im.contentUrl; if(!image && im) image = im;
      if(!title && o.name) title = o.name; if(!brand && o.brand) brand = typeof o.brand === "string" ? o.brand : (o.brand.name || "");
      const of = [].concat(o.offers || [])[0]; if(of && !price){ price = of.price || of.lowPrice || ""; cur = of.priceCurrency || ""; } } }catch(_){}
  }
  image = image || meta("og:image") || meta("og:image:secure_url") || meta("twitter:image");
  title = title || meta("og:title") || meta("twitter:title") || (doc.title || "");
  price = price || meta("product:price:amount") || meta("og:price:amount"); cur = cur || meta("product:price:currency") || meta("og:price:currency");
  brand = brand || meta("product:brand") || meta("og:brand");
  title = String(title).split(/\s[|–-]\s/)[0].trim();
  let img = null; try{ img = image ? new URL(image, base).href : null; }catch(_){}
  return {title, image: img, price: price ? `${cur ? cur + " " : ""}${price}` : "", brand: String(brand || "").trim()};
}
async function getFromLink(){
  const s0 = sheet; const url = safeUrl(($("#lurl")?.value || s0.url || "").match(/https?:\/\/\S+/)?.[0]);
  if(!url){ s0.err = "That doesn’t look like a link. It should start with https://"; renderSheet(); return; }
  s0.url = url; s0.busy = true; s0.err = null; renderSheet();
  try{
    const page = await getPage(url); const pr = parseProduct(page.html, page.url);
    if(!pr.image) throw new Error("no image");
    const blob = await getImage(pr.image); if(!blob || !/^image\//.test(blob.type || "image/")) throw new Error("not an image");
    if(sheet !== s0) return;
    const extra = {toBuy:true, link:url, shop:shopName(page.url || url), price:pr.price.slice(0,20), brand:pr.brand.slice(0,30), name:pr.title.slice(0,40)};
    if(s0.forId){ sheet = null; renderSheet(); await replacePhoto(s0.forId, blob); }

}

    case "rate": aiRate(); document.dispatchEvent(new CustomEvent("pmf:event", {detail:{type:"ai_asked"}})); break;
    case "save": if(Object.keys(S.sel).length === 0){ toast("Pick some clothes first."); break; } sheet = {type:"name", name:""}; renderSheet(); setTimeout(() => $("#oname")?.focus(), 50); break;
    case "suggest": S.ask.occasion = $("#occ")?.value ?? S.ask.occasion; S.ask.weather = $("#wx")?.value ?? S.ask.weather; aiSuggest(); break;
    case "usesug": if(S.ask.result){ S.sel = {...S.ask.result.sel}; S.ai = null; saveSel(); setTab("outfit"); } break;
    case "compare": aiCompare(); break;
    case "uncompare": S.compare = []; S.cmp = null; render(); break;
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "occ") S.ask.occasion = e.target.value;
  if(e.target.id === "iname" && sheet && sheet.draft){ sheet.draft.name = e.target.value; sheet.draft.nameTouched = true; }
  if(sheet && sheet.draft && ["ibrand","iprice","ilink"].includes(e.target.id)) sheet.draft[{ibrand:"brand", iprice:"price", ilink:"link"}[e.target.id]] = e.target.value;
  if(e.target.id === "lurl" && sheet && sheet.type === "link") sheet.url = e.target.value;
  if(e.target.id === "icolor" && sheet && sheet.draft){ sheet.draft.colors = [e.target.value, ...(sheet.draft.colors||[]).slice(1)]; sheet.draft.colorTouched = true; }
});
document.addEventListener("change", e => {
  if(e.target.id === "wx") S.ask.weather = e.target.value;
  if(e.target.id === "icolor" && sheet) renderSheet();
  if(e.target.id === "fileIn"){ const f = e.target.files && e.target.files[0]; const pp = pendingPhoto; pendingPhoto = null;
    if(pp && pp.forId) replacePhoto(pp.forId, f); else onPhoto(f, pp && pp.extra); }
  if(e.target.id === "ibuy" && sheet && sheet.draft) sheet.draft.toBuy = e.target.checked;
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet) closeSheet(); });

render();
store.setSync();
if(window.claude && typeof claude.use === "function") store.init(); else store.startLocal();
})();
</script>
