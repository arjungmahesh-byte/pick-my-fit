name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PickMyFit-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename the app file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PickMyFit.apk
      - name: Publish the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pick My Fit 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **PickMyFit.apk** below on an Android phone, open it and allow "install unknown apps".
            If Play Protect warns about an unknown developer, tap More details, then Install anyway.
          files: PickMyFit.apk
