name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - run: npm ci
      - run: npm run build && npx cap sync android
        env:
          BUILD_NUM: ${{ github.run_number }}
      - name: Make the signing key (first time only)
        env:
          PMF_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$PMF_KEY_PASS" ] && [ ! -f android/app/pickmyfit-signing.p12 ]; then
            keytool -genkeypair -keystore android/app/pickmyfit-signing.p12 -storetype PKCS12 -alias pickmyfit \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PMF_KEY_PASS" -keypass "$PMF_KEY_PASS" -dname "CN=Pick My Fit"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/pickmyfit-signing.p12
            git commit -m "Add the app's signing key (locked with the ANDROID_KEY_PASSWORD secret) [skip ci]"
            git push
          fi
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          BUILD_NUM: ${{ github.run_number }}
          PMF_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: PickMyFit-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename the app file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PickMyFit.apk
      - name: Publish the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pick My Fit 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **PickMyFit.apk** below on an Android phone, open it and allow "install unknown apps".
            If Play Protect warns about an unknown developer, tap More details, then Install anyway.
          files: PickMyFit.apk
